<div class="project-detail-container">
    <div class="back-button">
        <a href="/projects" class="back-link">
            ← Back
        </a>
    </div>
    <div class="project-header">
        <p>Projet</p>
        <h1 id="projectTitle">Projet</h1>
    </div>
    <div class="project-content">
        <div class="text">



            <div class="project-meta">
                <div class="project-category-section">
                    <p>Année</p>
                    <span id="projectYear" class="year">2024</span>
                </div>
                <div class="project-category-section">
                    <p>Client</p>
                    <span id="projectClient" class="client">Client Name</span>
                </div>
                <div class="project-category-section">
                    <p>Catégorie</p>
                    <span id="projectCategory" class="category">

                    </span>
                </div>
            </div>


            <div class="project-description">
                <p>Description</p>
                <p id="projectDescription">Project description will be loaded here...</p>
            </div>

            <div class="project-detail">
                <div class="project-collaborators-section">
                    <p>Collaborateurs</p>
                    <div id="projectCollaborators" class="collaborators-list">
                        <!-- Collaborators will be loaded here -->
                    </div>
                </div>

                <div class="project-skills-section">
                    <p>Services</p>
                    <div id="projectSkills" class="skills-list">
                        <!-- Skills will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="parent-container">
            <div class="project-video-container">
                <video id="projectVideo" playsinline>
                    <source src="" type="video/mp4">
                    Your browser doesn't support HTML5 video.
                </video>
            </div>

            <!-- Video switcher (rendered when project has >1 video) -->
            <div class="project-video-switcher"></div>

            <!-- Track list with links to videos -->
            <div class="project-tracklist"></div>
        </div>
    </div>
</div>
